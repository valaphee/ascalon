[package]
name = "ascalon-asset"
version = "0.1.0"
edition = "2024"
description = "Unofficial Guild Wars 2 asset format tools"
license = "MIT"
documentation = "https://docs.rs/ascalon-asset"
repository = "https://github.com/valaphee/ascalon"

[features]
graphql = ["dep:async-graphql"]

[dependencies]
bitflags = "2"
zerocopy = { version = "0.8", features = ["derive"] }

rc4 = "0.2"
sha2 = "0.11"

async-graphql = { version = "8.0.0-rc.5", optional = true }

[build-dependencies]
quote = "1"
syn = "2"
proc-macro2 = "1"

ascalon-packfile-schema = { version = "0.1", path = "../packfile-schema" }
